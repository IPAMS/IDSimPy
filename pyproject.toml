[project]
name = "IDSimPy"
version = "0.1.0"
description = "Result analysis and input preprocessing for ion dynamics simulations with IDSimF"
readme = "README.md"
authors = [
    { name = "Physical and Theoretical Chemistry, University of Wuppertal", email = "wissdorf@uni-wuppertal.de" }
]
requires-python = ">=3.13"
dependencies = [
    "commentjson>=0.9.0",
    "ffmpeg-python>=0.2.0",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "vtk==9.7.1",
]

[project.urls]
Homepage = "https://github.com/IPAMS/IDSimPy"

[tool.setuptools]
packages = ["IDSimPy", "IDSimPy.analysis", "IDSimPy.preprocessing"]

